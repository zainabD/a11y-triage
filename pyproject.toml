[project]
name = "a11y-triage"
version = "0.1.0"
description = "Audit a page for WCAG violations and rank them by user impact."
requires-python = ">=3.9"
dependencies = ["beautifulsoup4>=4.12", "httpx>=0.27", "anthropic>=0.40"]

[project.scripts]
a11y-triage = "a11y_triage.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
